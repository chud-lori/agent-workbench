<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Agent Workbench logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- neural mesh (the brain) -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M256 100 L186 132"/>
    <path d="M256 100 L326 132"/>
    <path d="M186 132 L150 202"/>
    <path d="M326 132 L362 202"/>
    <path d="M186 132 L212 192"/>
    <path d="M326 132 L300 192"/>
    <path d="M212 192 L256 248"/>
    <path d="M300 192 L256 248"/>
    <path d="M150 202 L182 268"/>
    <path d="M362 202 L330 268"/>
    <path d="M182 268 L256 248"/>
    <path d="M330 268 L256 248"/>
  </g>

  <!-- stem: brain plugged into the bench -->
  <path d="M256 266 L256 338" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.65"/>

  <!-- nodes -->
  <g fill="#ffffff">
    <circle cx="256" cy="100" r="15"/>
    <circle cx="186" cy="132" r="12"/>
    <circle cx="326" cy="132" r="12"/>
    <circle cx="150" cy="202" r="12"/>
    <circle cx="362" cy="202" r="12"/>
    <circle cx="212" cy="192" r="10"/>
    <circle cx="300" cy="192" r="10"/>
    <circle cx="182" cy="268" r="10"/>
    <circle cx="330" cy="268" r="10"/>
  </g>
  <!-- core node -->
  <circle cx="256" cy="248" r="19" fill="url(#core)"/>

  <!-- workbench -->
  <rect x="88" y="342" width="336" height="26" rx="13" fill="#ffffff"/>
  <rect x="132" y="368" width="24" height="64" rx="12" fill="#ffffff" opacity="0.92" transform="rotate(8 144 368)"/>
  <rect x="356" y="368" width="24" height="64" rx="12" fill="#ffffff" opacity="0.92" transform="rotate(-8 368 368)"/>
</svg>
