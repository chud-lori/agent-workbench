[project]
name = "agent-workbench"
version = "0.2.0"
description = "Local, dependency-free memory and context layer for AI coding agents: persistent cross-tool brain, FTS code index, and setup diagnostics over MCP."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lori", email = "imlori000@gmail.com" }]
license = { text = "Private" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Private :: Do Not Upload",
]
dependencies = []

[project.scripts]
agent-workbench = "agent_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["agent_workbench*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
